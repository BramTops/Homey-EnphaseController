    <!-- Bottom Left -->
    <path d="M 325 630 H 255 V 690 H 325" stroke-width="24" />
    <path d="M 280 650 H 300 V 670 H 280 Z" stroke-width="12" />
    
    <!-- Bottom Right -->
    <path d="M 640 630 H 710 V 690 H 640" stroke-width="24" />
