    <path d="M 360 190 L 600 180 C 620 180 630 190 630 210 L 630 330 L 640 680 C 640 700 630 710 610 710 L 360 700 C 340 700 330 690 325 670 L 325 510 C 200 500 200 290 325 280 L 330 210 C 330 190 340 190 360 190 Z" stroke-width="36" />

    <!-- Top Rectangular Section -->
